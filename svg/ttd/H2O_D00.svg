<svg width="100%" height="100%" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="myLinearGradientStops" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="maroon" />
      <stop offset="0.5" stop-color="yellow" />
      <stop offset="1" stop-color="maroon" />
    </linearGradient>
    <radialGradient id="myRadialGradientRelative"
                    spreadMethod="repeat"
                    xlink:href="#myLinearGradientStops"
                    cx="0.5" cy="0.5" r="0.01" fx="0.5" fy="0.5"
                    gradientUnits="objectBoundingBox"
                    gradientTransform="scale(1 0.5625)"/>
    <desc>
      Логика мастей: 
        Жезлы (Кубы/Линии) - rotate(45); 
        Кубки (Сферы/Окружности) - scale(1 0.5625); 
        Мечи (Пирамиды) - rotate(45) skewY(15); 
        Монеты (Овалы) - scale(1 0.5625) scale(0.8 1). ???
    </desc>
  </defs>
  <rect x="0" y="0" width="1080" height="1920" fill="url(#myRadialGradientRelative)" stroke="none" />
</svg>